[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controllable-sycophancy-evals"
version = "0.1.0"
description = "Controlled synthetic-user generation and behavioral evaluation for LLM sycophancy research."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Elena Labzina"}]
dependencies = [
    "torch>=2.4",
    "transformers>=4.57",
    "datasets>=3.0",
    "accelerate>=1.1",
    "openai>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
