model_config: configs/model.example.yaml
evaluation_model_config: configs/evaluator.example.yaml

stages_path: synthetic/stages.yaml
topics_path: synthetic/topics_example.yaml
output_path: data/synthetic/raw/public_demo_validation.jsonl

calibration:
  enabled: true
  definitions_path: synthetic/calibration/stage_definitions.yaml
  anchors_path: synthetic/calibration/example_anchors.csv
  examples_per_stage: 1
  contrast_examples_per_adjacent_stage: 1
